name: CI

# Learning setup: run on every push, on every Pull Request update,
# on a schedule and manually. A real project would usually use fewer triggers.
on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    # Weekdays at 05:00 UTC
    - cron: '0 5 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

# A new run for the same ref cancels the older one that is still running.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  # Pin a concrete version for reproducible runs (check yours: docker images bkimminich/juice-shop).
  JUICE_SHOP_IMAGE: bkimminich/juice-shop:v20.2.0
  BASE_URL: http://localhost:3000
  # Do not install Git hooks on the runner.
  HUSKY: '0'

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

  ui-tests:
    name: UI tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
      WRONG_PASSWORD: ${{ secrets.WRONG_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start Juice Shop
        run: docker run -d --name juice-shop -p 3000:3000 "$JUICE_SHOP_IMAGE"

      - name: Wait until Juice Shop is ready
        run: |
          curl --fail --silent --show-error \
            --retry 30 --retry-delay 2 --retry-all-errors --max-time 5 \
            "$BASE_URL/rest/admin/application-version" \
            || { echo "::error::Juice Shop did not become ready in time"; docker logs juice-shop; exit 1; }

      - name: Run UI tests
        run: npm run test:ui

      - name: Show Juice Shop logs
        if: failure()
        run: docker logs juice-shop

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-ui
          path: playwright-report/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload test results (screenshots, traces)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-ui
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
      WRONG_PASSWORD: ${{ secrets.WRONG_PASSWORD }}
      REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start Juice Shop
        run: docker run -d --name juice-shop -p 3000:3000 "$JUICE_SHOP_IMAGE"

      - name: Wait until Juice Shop is ready
        run: |
          curl --fail --silent --show-error \
            --retry 30 --retry-delay 2 --retry-all-errors --max-time 5 \
            "$BASE_URL/rest/admin/application-version" \
            || { echo "::error::Juice Shop did not become ready in time"; docker logs juice-shop; exit 1; }

      - name: Run API tests (without known defects)
        run: npm run test:api:stable

      - name: Show Juice Shop logs
        if: failure()
        run: docker logs juice-shop

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-api
          path: playwright-report/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-api
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

  # Tests for known Juice Shop defects. They assert the correct behavior, so they fail
  # until the application is fixed. The job is visible but does not fail the workflow.
  known-defects:
    name: Known defects (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    env:
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
      WRONG_PASSWORD: ${{ secrets.WRONG_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start Juice Shop
        run: docker run -d --name juice-shop -p 3000:3000 "$JUICE_SHOP_IMAGE"

      - name: Wait until Juice Shop is ready
        run: |
          curl --fail --silent --show-error \
            --retry 30 --retry-delay 2 --retry-all-errors --max-time 5 \
            "$BASE_URL/rest/admin/application-version" \
            || { echo "::error::Juice Shop did not become ready in time"; docker logs juice-shop; exit 1; }

      - name: Run known-defect tests
        run: npm run test:api:defects

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-known-defects
          path: playwright-report/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-known-defects
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

  stand-tests:
    name: Stand tests (API + SQL)
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 20

    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      STAND_REPO: opudrovs/react-api-data-sample
      STAND_REF: 208b3e9e5958cef39a319f11ab62a386a5de1c42

      DB_HOST: localhost
      DB_PORT: '5433'
      DB_NAME: taskmanager_db
      DB_USER: taskmanager_postgres
      STAND_API_URL: http://localhost:4000
    steps:
      - name: Checkout tests
        uses: actions/checkout@v4

      - name: Checkout stand
        uses: actions/checkout@v4
        with:
          repository: ${{ env.STAND_REPO }}
          ref: ${{ env.STAND_REF }}
          path: stand

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare stand .env
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          DB_PASSWORD="$(openssl rand -hex 16)"
          echo "::add-mask::$DB_PASSWORD"
          echo "DB_PASSWORD=$DB_PASSWORD" >> "$GITHUB_ENV"
          cat > stand/.env << ENVFILE
          SUPABASE_URL=${SUPABASE_URL}
          SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
          POSTGRES_USER=${DB_USER}
          POSTGRES_PASSWORD=${DB_PASSWORD}
          POSTGRES_DB=${DB_NAME}
          DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
          PORT=4000
          FRONTEND_URL=http://localhost:3000
          ENABLE_SWAGGER=true
          ENVFILE

      - name: Start stand (PostgreSQL + backend)
        working-directory: stand
        run: docker compose up -d --build postgres backend

      - name: Wait for stand API
        run: |
          # Без авторизации API отвечает 401, это значит, что backend поднялся и готов.
          for i in $(seq 1 60); do
            code="$(curl -s -o /dev/null -w '%{http_code}' "$STAND_API_URL/api/tasks" || true)"
            if [ "$code" = "401" ]; then echo "Stand is ready"; exit 0; fi
            echo "Attempt $i: status $code, waiting..."
            sleep 5
          done
          echo "Stand did not become ready in time"
          exit 1

      - name: Run stand tests
        env:
          STAND_USER_EMAIL: ${{ secrets.STAND_USER_EMAIL }}
          STAND_USER_PASSWORD: ${{ secrets.STAND_USER_PASSWORD }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          WRONG_PASSWORD: ${{ secrets.WRONG_PASSWORD }}
        run: npm run test:stand

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-stand
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-stand
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stand logs on failure
        if: failure()
        working-directory: stand
        run: docker compose logs --no-color

      - name: Stop stand
        if: always()
        working-directory: stand
        run: docker compose down -v
